name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Testes unitários e da API (sem base de dados)
        run: npm test
      - name: Dependências sem vulnerabilidades conhecidas (produção)
        run: npm audit --omit=dev --audit-level=high

  backend-integracao:
    # Concorrência (pagamentos, vales, limites), RGPD e planos das consultas (explain) contra um MongoDB real.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run test:integracao
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: O build de produção não publica source maps
        run: |
          if find dist -name '*.map' | grep -q .; then echo "Há ficheiros .map no build."; exit 1; fi
          if grep -rl 'sourceMappingURL' dist; then echo "Há comentários sourceMappingURL no build."; exit 1; fi
      - run: npm run test:ci
      - name: Dependências sem vulnerabilidades conhecidas (produção)
        run: npm audit --omit=dev --audit-level=high

  segredos:
    # Procura credenciais em todo o histórico do Git.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner
