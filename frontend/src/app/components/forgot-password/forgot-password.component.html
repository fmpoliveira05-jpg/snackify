<section class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header text-center"><h3>Recuperar a palavra-passe</h3></div>
        <div class="card-body">
          <div *ngIf="message; else form" class="alert alert-info mb-0" role="status">{{ message }}</div>

          <ng-template #form>
            <p class="text-muted">Indique o email da sua conta. Se existir, enviamos um link para escolher uma nova palavra-passe (válido durante 30 minutos).</p>
            <form (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="email"
                       maxlength="254" required email [(ngModel)]="email" />
              </div>

              <div class="visually-hidden" aria-hidden="true">
                <label for="website">Não preencha este campo</label>
                <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" [(ngModel)]="website" />
              </div>

              <app-turnstile (token)="turnstileToken = $event"></app-turnstile>

              <button type="submit" class="btn btn-primary w-100"
                      [disabled]="f.invalid || isSending || (turnstileEnabled && !turnstileToken)">
                Enviar link
              </button>
            </form>
            <p class="text-danger mt-3" *ngIf="errorMessage">{{ errorMessage }}</p>
          </ng-template>

          <p class="mt-3 mb-0 text-center"><a routerLink="/login">Voltar ao login</a></p>
        </div>
      </div>
    </div>
  </div>
</section>
