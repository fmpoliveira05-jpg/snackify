<div class="container mt-5">
  <h2 *ngIf="menu">{{ menu.title }}</h2>
  <p *ngIf="menu?.description" class="text-muted">{{ menu.description }}</p>

  <div class="row">
    <div *ngFor="let dish of dishes" class="col-md-4 mb-3">
      <app-dish-card [dish]="dish" (add)="addToCart($event)"></app-dish-card>
    </div>
  </div>
</div>
