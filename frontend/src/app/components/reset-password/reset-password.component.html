<section class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header text-center"><h3>Nova palavra-passe</h3></div>
        <div class="card-body">
          <div *ngIf="message" class="alert alert-success" role="status">
            {{ message }} <a routerLink="/login" class="alert-link">Iniciar sessão</a>
          </div>

          <div *ngIf="!token && !message" class="alert alert-warning mb-0">
            O link é inválido ou já expirou. <a routerLink="/recuperar-password" class="alert-link">Pedir um novo link</a>
          </div>

          <form *ngIf="token && !message" (ngSubmit)="onSubmit()" novalidate>
            <div class="mb-3">
              <label for="password" class="form-label">Nova palavra-passe</label>
              <input id="password" name="password" type="password" class="form-control" autocomplete="new-password"
                     [attr.minlength]="minLength" [attr.maxlength]="maxLength" required [(ngModel)]="password" #p="ngModel"
                     aria-describedby="passwordHelp" />
              <div id="passwordHelp" class="form-text" [class.text-danger]="p.touched && !isStrong">{{ passwordMessage }}</div>
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Repita a palavra-passe</label>
              <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password"
                     [attr.maxlength]="maxLength" required [(ngModel)]="confirmPassword" #c="ngModel" />
              <div class="text-danger mt-1" *ngIf="c.touched && !matches">As palavras-passe não coincidem.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="!isStrong || !matches || isSaving">Guardar</button>
            <p class="text-danger mt-3" *ngIf="errorMessage">
              {{ errorMessage }} <a routerLink="/recuperar-password">Pedir um novo link</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
