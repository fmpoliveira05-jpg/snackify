<div class="container mt-5 mb-5">
  <div class="card shadow p-4">
    <h1 class="mb-4">Avaliar pedido</h1>

    <div *ngIf="order">
      <div class="mb-4">
        <h5><strong>Restaurante:</strong> {{ order.restaurantId?.name }}</h5>
        <p><strong>Data e hora da encomenda:</strong> {{ order.orderDate | date:'short' }}</p>
      </div>

      <div class="mb-4">
        <h5>Itens adquiridos:</h5>
        <ul class="list-group">
          <li *ngFor="let d of order.dishes" class="list-group-item">
            {{ d.amount }}x {{ d.dishId?.name || 'Prato removido' }} ({{ d.dose }} dose)
          </li>
        </ul>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" enctype="multipart/form-data">
        <div class="form-group mb-3">
          <label for="title">Título</label>
          <input id="title" formControlName="title" class="form-control" required />
        </div>

        <div class="form-group mb-3">
          <label for="description">Descrição</label>
          <textarea id="description" formControlName="description" rows="5" class="form-control" required></textarea>
        </div>

        <div class="form-group mb-3">
          <label for="image">Imagem (opcional)</label>
          <input type="file" id="image" (change)="onFileChange($event)" class="form-control" />
        </div>

        <div class="mb-3" *ngIf="previewUrl">
          <label class="form-label">Preview:</label><br />
          <img [src]="previewUrl" class="img-thumbnail" style="max-width: 200px;" />
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Submeter avaliação</button>
          <a routerLink="/user/perfil" class="btn btn-secondary">Cancelar</a>
        </div>

        <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
      </form>
    </div>
  </div>
</div>
