<div class="container mt-4">
  <h2>Restaurantes validados</h2>
  <app-loading *ngIf="isLoading" message="A carregar restaurantes…"></app-loading>
  <app-error-state *ngIf="!isLoading && error" [message]="error" (retry)="loadRestaurants()"></app-error-state>
  <app-empty-state *ngIf="!isLoading && !error && checkedRestaurants.length === 0" message="Ainda não há restaurantes validados."
    actionLabel="Ver pedidos pendentes" actionLink="/user/perfil/validar-restaurantes"></app-empty-state>

  <ul *ngIf="!isLoading && checkedRestaurants.length > 0" class="list-group">
    <li *ngFor="let restaurant of checkedRestaurants" class="list-group-item d-flex justify-content-between align-items-center">
      <strong>{{ restaurant.name }}</strong>
      <div>
        <button type="button" class="btn btn-warning btn-sm me-2" (click)="disableRestaurant(restaurant._id)" [disabled]="busyId === restaurant._id">
          Desativar
        </button>
        <button type="button" class="btn btn-danger btn-sm" (click)="deleteRestaurant(restaurant._id)" [disabled]="busyId === restaurant._id">
          Remover
        </button>
      </div>
    </li>
  </ul>
</div>
