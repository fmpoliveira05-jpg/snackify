<div *ngIf="error" class="error">{{ error }}</div>

<ul *ngIf="categories.length > 0; else noData">
  <li *ngFor="let category of categories" class="d-flex justify-content-between align-items-center">
    <strong>{{ category.name }}</strong>
    <button class="btn btn-danger btn-sm" (click)="deleteCategory(category._id)">
      Remover
    </button>
  </li>
</ul>

<ng-template #noData>
  <p>Não há categorias para mostrar.</p>
</ng-template>
